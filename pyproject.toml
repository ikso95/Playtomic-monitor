[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "playtomic-availability-monitor"
version = "0.1.0"
description = "Playtomic availability monitor and MCP tools."
requires-python = ">=3.12"
dependencies = [
    "fastmcp>=2.12.0",
]

[project.scripts]
playtomic-monitor = "playtomic_monitor:main"
playtomic-mcp = "playtomic_mcp:main"

[tool.setuptools]
py-modules = ["playtomic_core", "playtomic_monitor", "playtomic_mcp"]

[tool.pytest.ini_options]
pythonpath = ["."]
